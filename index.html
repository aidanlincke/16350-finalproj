<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CMU Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    canvas.grid-layer {
      position: absolute;
      z-index: 500;
      pointer-events: none;
    }
    #run-button {
      position: absolute;
      top: 30px;
      left: 50px;
      z-index: 1000;
    }
    #reset-button {
      position: absolute;
      top: 50px;
      left: 50px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <select id="grid-toggle" style="position: absolute; top: 10px; left: 50px; z-index: 1000;">
    <option value="walking" selected>Walking Grid</option>
    <option value="biking">Biking Grid</option>
  </select>
  <button id="run-button">Run A*</button>
  <button id="reset-button">Reset</button>

  <script src="astar.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    function latLngToRowCol(lat, lng, width, height, topleft, bottomright) {
      const row = Math.floor((lat - topleft[0]) / (bottomright[0] - topleft[0]) * height);
      const col = Math.floor((lng - topleft[1]) / (bottomright[1] - topleft[1]) * width);
      return [row, col];
    }

    function rowColToLatLng(row, col, width, height, topleft, bottomright) {
      const lat = topleft[0] + (row / height) * (bottomright[0] - topleft[0]);
      const lng = topleft[1] + (col / width)  * (bottomright[1] - topleft[1]);
      return [lat, lng];
    }


    // Load map JSON
    fetch("map.json")
      .then(response => response.json())
      .then(data => {
        const topleft_latlon = data.topleft_latlon;
        const bottomright_latlon = data.bottomright_latlon;
        const width = data.width;
        const height = data.height;
        const bike_racks = data.bike_racks;
        const walking = data.walking;
        const biking = data.biking;

        let pathLayer = null;
        let bikeRackLayer = L.layerGroup();
        let startMarker = null;
        let endMarker = null;

        bike_racks.forEach(([row, col]) => {
          const [lat, lng] = rowColToLatLng(row, col, width, height, topleft_latlon, bottomright_latlon);
          const marker = L.circleMarker([lat, lng], {
            radius: 5,
            color: "green",
            fillColor: "lime",
            fillOpacity: 0.8
          });
          bikeRackLayer.addLayer(marker);
        });

        // Create map centered at midpoint of bounds
        const map = L.map('map').setView([
          (topleft_latlon[0] + bottomright_latlon[0]) / 2,
          (topleft_latlon[1] + bottomright_latlon[1]) / 2
        ], 17);
        bikeRackLayer.addTo(map);

        map.on('click', function(e) {
          const { lat, lng } = e.latlng;
          const [row, col] = latLngToRowCol(lat, lng, width, height, topleft_latlon, bottomright_latlon);
          console.log("Clicked at ", e.latlng, row, col);

          const marker = L.marker([lat, lng], { draggable: true });

          if (startMarker == null) {
            const marker = L.marker([lat, lng], { draggable: true });

            // Create a little dropdown HTML element
            const popupContent = `
              <strong>Start</strong><br/>
              <label for="mode-select">Mode:</label>
              <select id="mode-select">
                <option value="walking" selected>Walk</option>
                <option value="biking">Bike</option>
              </select>
            `;

            startMarker = marker.addTo(map)
              .bindPopup(popupContent)
              .openPopup();

              startMarker.on("popupopen", () => {
                const select = document.getElementById("mode-select");
                if (select) {
                  startMarker.mode = select.value;
                  select.addEventListener("change", () => {
                    startMarker.mode = select.value;
                  });
                }
              });

          } else if (endMarker == null) {
            const popupContent = `
              <strong>Goal</strong><br/>
            `;
            endMarker = marker.addTo(map).bindPopup(popupContent).openPopup();
          }
        });

        document.getElementById("reset-button").addEventListener("click", () => {
          if (startMarker) {
            map.removeLayer(startMarker);
            startMarker = null;
          }
          if (endMarker) {
            map.removeLayer(endMarker);
            endMarker = null;
          }
          if (pathLayer) {
            map.removeLayer(pathLayer);
            pathLayer = null;
          }
        });

        // Base layer
        L.tileLayer('https://basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
          subdomains: 'abcd',
          maxZoom: 20
        }).addTo(map);

        // Create and overlay canvas
        function drawGrid(type) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const grid = type === "biking" ? biking : walking;
          ctx.fillStyle = type === "biking" ? "rgba(0, 0, 255, 1)" : "rgba(255, 0, 0, 1)";

          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              if (grid[y][x] === 0) {
                ctx.fillRect(x, y, 1, 1);
              }
            }
          }

          img.src = canvas.toDataURL();
        }

        const img = new Image();
        img.onload = () => {
          const imageBounds = [
            [bottomright_latlon[0], topleft_latlon[1]],
            [topleft_latlon[0], bottomright_latlon[1]]
          ];

          if (map.gridOverlay) {
            map.removeLayer(map.gridOverlay);
          }

          map.gridOverlay = L.imageOverlay(img.src, imageBounds, { opacity: 0.6 });
          map.gridOverlay.addTo(map);
        };

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.className = "grid-layer";
        const ctx = canvas.getContext("2d");
        drawGrid("walking");

        document.getElementById("grid-toggle").addEventListener("change", (e) => {
          drawGrid(e.target.value);
          if (map.gridOverlay) {
            map.removeLayer(map.gridOverlay);
          }

          img.onload(); // re-add updated overlay
        });

        createAStarModule().then((Module) => {

          const width = data.width;
          const height = data.height;
          
          const walkingFlat = walking.flat();
          const bikingFlat = biking.flat();
          const bikeRacksFlat = bike_racks.flat();

          const walkingPtr = Module._malloc(walkingFlat.length * 4);
          const bikingPtr = Module._malloc(bikingFlat.length * 4);
          const bikeRacksPtr = Module._malloc(bikeRacksFlat.length * 4);

          Module.HEAP32.set(walkingFlat, walkingPtr / 4);
          Module.HEAP32.set(bikingFlat, bikingPtr / 4);
          Module.HEAP32.set(bikeRacksFlat, bikeRacksPtr / 4);
          Module._transfer_params(width, height, walkingPtr, bikingPtr, bikeRacksPtr, bike_racks.length);
          Module._free(walkingPtr);
          Module._free(bikingPtr);
          Module._free(bikeRacksPtr);

          document.getElementById("run-button").addEventListener("click", () => {
            if (startMarker == null || endMarker == null) {
              alert("Place start and end markers to run A*.");
              return;
            }
            startMarker.dragging.disable();
            endMarker.dragging.disable();

            const { lat: startLat, lng: startLon } = startMarker.getLatLng();
            const { lat: goalLat, lng: goalLon } = endMarker.getLatLng();

            const [startRow, startCol] = latLngToRowCol(startLat, startLon, width, height, topleft_latlon, bottomright_latlon);
            const [goalRow, goalCol] = latLngToRowCol(goalLat, goalLon, width, height, topleft_latlon, bottomright_latlon);

            const modeStr = startMarker.mode || "walking";
            const mode = modeStr === "biking" ? 1 : 0;

            const ptr = Module._aStar(startRow, startCol, goalRow, goalCol, mode);
            const length = Module._aStarPathLength();
            const pathFlat = new Int32Array(Module.HEAP32.buffer, ptr, length * 3);

            const path = [];
            for (let i = 0; i < length; i++) {
              path.push({ r: pathFlat[3 * i], c: pathFlat[3 * i + 1] });
            }
            
            if (pathLayer) {
              map.removeLayer(pathLayer);
            }

            // Convert path grid coords to lat/lng
            const latlngs = path.map(p => {
              const lat = topleft_latlon[0] + (p.r / height) * (bottomright_latlon[0] - topleft_latlon[0]);
              const lng = topleft_latlon[1] + (p.c / width)  * (bottomright_latlon[1] - topleft_latlon[1]);
              return [lat, lng];
            });

            // Draw the new path
            pathLayer = L.polyline(latlngs, { color: 'blue', weight: 3 }).addTo(map);
          });
        });
      });
  </script>
</body>
</html>
